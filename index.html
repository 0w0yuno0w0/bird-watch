<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>庭に鳥を呼ぶ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap">
<style>
:root{--fg:#2b3a33;--chip:rgba(255,255,255,.55);--chipon:rgba(255,255,255,.95);
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#2b3a33}}
:root[data-theme="dark"]{--fg:#2b3a33}
html,body{margin:0;height:100%;background:#d3e9df;overflow:hidden;color:var(--fg);
 font:13px/1.5 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:2}
#bar button{font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:16px;padding:6px 16px;cursor:pointer}
#bar button[aria-pressed="true"]{background:var(--chipon);font-weight:700}
#tip{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2;
 background:var(--chip);padding:6px 14px;border-radius:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#tip.show{opacity:1}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
#tools{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:0 10px;overflow-x:auto;justify-content:safe center;z-index:2}
#tools button{flex:none;font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:14px;padding:5px 12px;cursor:pointer}
#tools button[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 2px #6a9a5a inset;font-weight:700}
#bookBtn.new::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9534f;margin-left:5px}
#book{position:fixed;inset:0;z-index:5;background:rgba(30,35,30,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#book[hidden]{display:none}
#book .paper{width:min(460px,100%);max-height:78%;overflow:auto;background:#fbf5e3;border-radius:6px;padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.3);
 font-family:"Yomogi","Zen Kurenaido","Hiragino Maru Gothic ProN",cursive;color:#27306b;
 background-image:repeating-linear-gradient(transparent 0 29px,rgba(80,110,160,.25) 29px 30px)}
#book h2{margin:0 0 6px;font-size:18px;font-weight:400;color:#7a5a30}
#bookIn{position:relative}
.entry{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.thumb{width:48px;height:39px;image-rendering:pixelated;flex:none}
.txt p{margin:0;line-height:30px;font-size:16px}
.ch{display:inline-block;clip-path:inset(0 100% 0 0)}
.ch.on{clip-path:inset(0 0 0 0);transition:clip-path .08s linear}
#pen{position:absolute;font-size:20px;pointer-events:none;transition:left .05s linear,top .05s linear;transform:translate(-2px,-4px)}
.empty{font-size:15px;line-height:30px;color:#8a8f9c}
#bookClose{font:inherit;background:#fff;border:0;border-radius:14px;padding:6px 20px;cursor:pointer;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.ch.on,#pen{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip"></div>
<div id="tools">
 <button data-t="feed" aria-pressed="false">餌台</button><button data-t="water" aria-pressed="false">水場</button><button data-t="bush" aria-pressed="false">低木</button>
 <button data-t="box" aria-pressed="false">巣箱</button><button data-t="post" aria-pressed="false">止まり木</button><button data-t="flower" aria-pressed="false">花壇</button>
 <button data-t="del" aria-pressed="false">撤去</button><button id="bookBtn">ノート</button>
</div>
<div id="bar">
 <button data-s="0" aria-pressed="true">春</button><button data-s="1" aria-pressed="false">夏</button>
 <button data-s="2" aria-pressed="false">秋</button><button data-s="3" aria-pressed="false">冬</button>
</div>
<div id="book" hidden><div class="paper" id="bookPaper"><h2>観察ノート</h2><div id="bookIn"><span id="pen">🖋️</span><div id="bookList"></div></div></div><button id="bookClose">とじる</button></div>
<script>
(()=>{
'use strict';
const W=256,H=168,N=13,OX=128,OY=40,TH=8;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
const R=Math.random,rr=(a,b)=>a+R()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const hs=(x,y)=>{x|=0;y|=0;let h=(x*374761393+y*668265263)^(x*y*97);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;};
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const proj=(gx,gy)=>[Math.round(OX+(gx-gy)*8),Math.round(OY+(gx+gy)*4)];

// ---------- 季節 ----------
const seas=o=>({bg:hx(o.bg),g:o.g.map(hx),ga:hx(o.ga),gap:o.gap,A:o.A.map(hx),al:o.al,aa:hx(o.aa),aap:o.aap,B:o.B.map(hx),bl:o.bl,ba:hx(o.ba),bap:o.bap,sn:o.sn});
const S=[
 seas({bg:'#d3e9df',g:['#8cc56e','#7bb662','#6ba656'],ga:'#fdf7d0',gap:.035,A:['#fbdce6','#f4aec7','#df82a8','#b9587f'],al:.85,aa:'#ffffff',aap:.07,B:['#ffffff','#f6e9ef','#e4c6d4','#bb9aac'],bl:.75,ba:'#f9c4d6',bap:.05,sn:0}),
 seas({bg:'#bfe3ea',g:['#63a94d','#56964a','#4a8541'],ga:'#f4ee7a',gap:.012,A:['#86d16a','#5cae50','#3f8845','#2b6533'],al:1,aa:'#d2f58f',aap:.05,B:['#7cc767','#54a24e','#3c7f41','#2a5c30'],bl:1,ba:'#c8f08a',bap:.04,sn:0}),
 seas({bg:'#efdcb8',g:['#bfa752','#ac9247','#997d3d'],ga:'#d8632a',gap:.09,A:['#f8c245','#ea8f2f','#cc5d27','#96391f'],al:.88,aa:'#ff7d1e',aap:.07,B:['#f07349','#d64a33','#ab2f29','#7a2120'],bl:.88,ba:'#ffb040',bap:.03,sn:0}),
 seas({bg:'#cfdae6',g:['#f4f8fb','#e5edf4','#d5e0ea'],ga:'#8ea36f',gap:.025,A:['#c7b9a8','#a99a88','#8a7b6a','#6a5c4e'],al:.04,aa:'#ffffff',aap:0,B:['#c7b9a8','#a99a88','#8a7b6a','#6a5c4e'],bl:.04,ba:'#ffffff',bap:0,sn:1})
];
const NAME=['春','夏','秋','冬'];
const mix=(a,b,t)=>typeof a==='number'?lerp(a,b,t):Array.isArray(a)?a.map((v,i)=>mix(v,b[i],t)):Object.fromEntries(Object.keys(a).map(k=>[k,mix(a[k],b[k],t)]));
let P=S[0],from=S[0],cur=0,tt=1,auto=true,autoT=0;

// ---------- 静的レイヤー ----------
const D=new Uint8ClampedArray(W*H*4),img=new ImageData(D,W,H);
const stC=document.createElement('canvas');stC.width=W;stC.height=H;const stX=stC.getContext('2d');
function px(x,y,c){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255;}
const rc=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c);};
function line(x1,y1,x2,y2,c,snow){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;
 for(let i=0;i<=n;i++){const x=Math.round(lerp(x1,x2,i/n)),y=Math.round(lerp(y1,y2,i/n));px(x,y,c);if(snow)px(x,y-1,[250,252,255]);}}
const EL=['#6b4f37','#5d432f'].map(hx),ER=['#83613f','#755636'].map(hx);
const CB=[hx('#6a4f39'),hx('#7d5c40'),hx('#8f6b46')];
const SH=[[4.6,4.4,3.8,2.6],[10.6,3.9,2.8,2],[12.2,10.8,2.4,1.6],[3.2,10.4,2.6,1.6],[3.2,7.2,1.4,1]];
const shade=(gx,gy)=>{let f=1;for(const s of SH){const dx=(gx-s[0])/s[2],dy=(gy-s[1])/s[3];if(dx*dx+dy*dy<1)f*=.84;}return f;};
const TREES=[
 {k:'B',p:proj(9.8,3.4),h:26,seed:11,cl:[[0,0,12],[-10,5,9],[10,4,9],[0,-8,8]],br:[[0,-14,-13,-23],[0,-17,12,-24],[0,-22,3,-33]]},
 {k:'A',p:proj(3.6,3.8),h:34,seed:3,cl:[[0,0,16],[-14,6,11],[13,5,12],[-5,-10,10],[8,-9,10]],br:[[0,-17,-20,-30],[0,-22,19,-32],[0,-30,-8,-42],[1,-26,11,-38]]},
 {k:'B',p:proj(11.4,10.4),h:22,seed:23,cl:[[0,0,10],[-8,4,7],[8,3,7],[0,-6,6]],br:[[0,-12,-11,-19],[0,-14,10,-20],[0,-18,2,-27]]},
 {k:'A',p:proj(2.4,9.8),h:24,seed:31,cl:[[0,0,10],[-8,4,7],[8,3,7],[0,-7,6]],br:[[0,-12,-11,-19],[0,-14,10,-20],[0,-18,2,-27]]}
];
const ROCK=proj(2.8,7.0),BAS=proj(7.6,8.2),FEED=proj(5.0,5.6);
const BUSH=[proj(6.6,2.8),proj(12,6.4),proj(1.8,4.8),proj(5.4,11.4)];
const STONES=[proj(6.0,11.0),proj(6.9,10.3),proj(7.6,11.0),proj(8.6,10.6)];

function ground(){
 const g=P.g,bg=P.bg,gg=g[2].map(v=>v*.8);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const a=(x-OX)/8;let b=(y-OY)/4,gx=(a+b)/2,gy=(b-a)/2;
  if(gx>=0&&gy>=0&&gx<N&&gy<N){
   const n=hs(Math.floor(gx*3),Math.floor(gy*3))*.6+hs(x,y)*.4;
   let c=g[n<.35?2:n<.65?1:0];
   if(hs(x*7+3,y*13)<P.gap)c=P.ga;
   const f=shade(gx,gy);px(x,y,[c[0]*f,c[1]*f,c[2]*f]);
  }else{
   let done=false;
   for(let t=1;t<=TH;t++){const b2=(y-t-OY)/4,gx2=(a+b2)/2,gy2=(b2-a)/2;
    if(gx2>=0&&gy2>=0&&gx2<N&&gy2<N){const k=hs(x>>1,y>>1)<.5?0:1;px(x,y,t<=1?gg:(x<OX?EL[k]:ER[k]));done=true;break;}}
   if(!done)px(x,y,bg);
  }
 }
}
function ell(cx,cy,rx,ry,fn){for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)fn(x,y,dx,dy);}}
function tree(t){
 const[bx,by]=t.p,h=t.h,pal=P[t.k],leaf=P[t.k==='A'?'al':'bl'],acc=P[t.k==='A'?'aa':'ba'],accp=P[t.k==='A'?'aap':'bap'],snow=P.sn>.5;
 for(let i=0;i<h;i++){const y=by-i,xo=Math.round(Math.sin(i*.15+t.seed)*1.2),w=i<h*.5?4:3;
  for(let j=0;j<w;j++)px(bx-Math.floor(w/2)+xo+j,y,CB[j===0?0:j===w-1?2:1]);}
 for(const b of t.br)line(bx+b[0],by+b[1],bx+b[2],by+b[3],CB[0],snow);
 for(const c of t.cl){const cx=bx+c[0],cy=by-h+c[1],r=c[2];
  ell(cx,cy,r,r*.82,(x,y,dx,dy)=>{
   const l=cl((-(x-cx)*.55-(y-cy)*.85)/r,-1,1)+(hs(x,y)-.5)*.35,e=Math.sqrt(dx*dx+dy*dy);
   if(hs(x+t.seed,y*3)>=leaf*(e>.85?.75:1))return;
   px(x,y,hs(x*5+t.seed,y*3)<accp?acc:pal[l>.5?0:l>0?1:l>-.5?2:3]);});}
}
const BP=['#5fa050','#468a45','#337038','#245628'].map(hx);
function bush(b){const[bx,by]=b,acc=[0,1,2].map(i=>lerp(hx('#f5f0a0')[i],hx('#c8382e')[i],P.sn));
 for(const c of[[0,0,9],[-7,3,6],[7,3,6]])ell(bx+c[0],by-5+c[1],c[2],c[2]*.75,(x,y,dx,dy)=>{const l=-dx*.5-dy*.8+(hs(x,y)-.5)*.35;
  px(x,y,P.sn>.5&&dy<-.3&&hs(x,y*3)<.7?[246,250,255]:hs(x*5,y*3)<.05+.05*P.sn?acc:BP[l>.4?0:l>0?1:l>-.5?2:3]);});}
function rock(){ell(ROCK[0],ROCK[1],9,7,(x,y,dx,dy)=>{const l=-dx*.5-dy*.8+(hs(x,y)-.5)*.3;
  px(x,y,P.sn>.5&&dy<-.15?[248,251,255]:hx(l>.35?'#b3b8bd':l>-.1?'#959ba2':'#767c84'));});}
const FLC=[['#f8c6d8','#ffffff','#f9e27a'],['#f6e15a','#b58ad8','#ffffff'],['#e9862c','#c9532b','#f2b134'],['#e8eef5','#c9d4e0','#8a7a5a']];
const IT={
 feed:{fl:0,draw(x,y){const wd=hx('#a9793f'),rd=hx('#c0503a');
  rc(x-1,y-14,3,14,hx('#7a5630'));rc(x-6,y-15,13,3,wd);rc(x-4,y-18,1,3,hx('#7a5630'));rc(x+4,y-18,1,3,hx('#7a5630'));
  rc(x-4,y-19,9,1,rd);rc(x-3,y-20,7,1,rd);rc(x-2,y-21,5,1,rd);rc(x-1,y-22,3,1,P.sn>.5?[248,251,255]:rd);
  for(let i=0;i<4;i++)px(x-3+i*2,y-16,hx('#e9c46a'));}},
 water:{fl:1,draw(x,y){ell(x,y+2,15,8,(a,b)=>px(a,b,hx('#6f757b')));
  ell(x,y,15,8,(a,b,dx,dy)=>px(a,b,hx(hs(a,b)<.1?'#8b9197':-dx*.4-dy*.6>.2?'#c2c7cb':'#a4aab0')));}},
 bush:{fl:0,draw(x,y){bush([x,y]);}},
 box:{fl:0,draw(x,y){rc(x-1,y-12,3,12,hx('#7a5630'));rc(x-5,y-22,11,10,hx('#b98a52'));rc(x-5,y-22,2,10,hx('#a17643'));
  const rf=P.sn>.5?[248,251,255]:hx('#8a4b2a');rc(x-6,y-24,13,2,rf);rc(x-4,y-26,9,2,rf);rc(x-2,y-28,5,2,rf);
  rc(x-2,y-20,5,5,hx('#2a2018'));}},
 post:{fl:0,draw(x,y){const c=CB[0];line(x,y,x+1,y-16,c,P.sn>.5);line(x+1,y-11,x+7,y-16,c,P.sn>.5);line(x,y-7,x-5,y-12,c,P.sn>.5);rc(x-1,y-1,3,2,CB[1]);}},
 flower:{fl:1,draw(x,y){const fc=FLC[cur].map(hx);ell(x,y,10,5,(a,b,dx,dy)=>px(a,b,dx*dx+dy*dy>.72?hx('#5a3f2c'):hs(a*3,b*7)<.3?fc[Math.floor(hs(a,b*5)*3)]:hx(cur===3?'#dfe6ee':'#6f9a55')));}}
};
function objects(){
 for(const s of STONES)ell(s[0],s[1],5,2.5,(x,y,dx,dy)=>px(x,y,hx((dy<-.2?'#c9ccd0':dy<.4?'#aab0b6':'#8b9198'))));
 for(const it of items)if(IT[it.t].fl)IT[it.t].draw(it.x,it.y);
 const list=[];
 for(const t of TREES)list.push([t.p[1],()=>tree(t)]);
 list.push([ROCK[1],rock]);
 for(const it of items)if(!IT[it.t].fl)list.push([it.y,()=>IT[it.t].draw(it.x,it.y)]);
 list.sort((a,b)=>a[0]-b[0]);for(const l of list)l[1]();
}
function build(){ground();objects();stX.putImageData(img,0,0);
 document.body.style.background='rgb('+P.bg.map(Math.round)+')';}

// ---------- 鳥 ----------
const SW=16,SHT=13;
const SPX={
 mejiro:{n:'メジロ',d:'目のまわりの白い輪。花の蜜を吸いにくる',wing:'#6d8230',
  col(x,y,k){const d=Math.hypot(x-12,y-3);
   if(k==='beak')return'#3f342c';if(k==='leg')return'#77685a';
   if(x===12&&y===3)return'#141414';
   if(k==='head'){if(d>1&&d<=2.1)return'#f6f4ea';return y>=5&&x>=10?'#e6d548':'#8fa53c';}
   if(k==='wing')return(x+y)%3?'#6d8230':'#7f9639';
   if(k==='tail')return'#647a2c';
   return y<6.2?'#8fa53c':(y<7.6&&x<8?'#d9a68c':'#eeebd9');}},
 shijukara:{n:'シジュウカラ',d:'白いほおと、おなかの黒いネクタイ',wing:'#6c8196',
  col(x,y,k){if(k==='beak')return'#2e2e2e';if(k==='leg')return'#55504a';
   if(k==='head')return((x-11.5)/2.6)**2+((y-5)/1.5)**2<=1?'#f7f7f2':'#1b1b23';
   if(k==='wing')return y===5&&x>=4&&x<=8?'#f2f2ee':'#6c8196';
   if(k==='tail')return'#6c8196';
   if(y<6.2)return'#8f9f7a';
   return Math.abs(y-(6.2+(11-x)*.45))<=.7&&x>=5&&x<=11?'#23232b':'#efe8b6';}},
 joubitaki:{n:'ジョウビタキ',d:'翼の白い斑点。冬にやってくる渡り鳥',wing:'#584844',
  col(x,y,k){if(k==='beak')return'#2b2b2b';if(k==='leg')return'#3d3733';
   if(k==='head')return x>=10&&y>=3&&y<=5?'#1c1c20':(y<=3?'#a8aeb6':'#8b9098');
   if(k==='wing')return x>=7&&x<=8&&y>=5&&y<=6?'#f6f6f0':'#584844';
   if(k==='tail')return'#d55a20';
   if(y<6.4)return'#7c8088';return y>=8.6?'#f0d0ac':'#e2712c';}}
};
const inb=(x,y)=>((x-7)/6.6)**2+((y-6.6)/4.2)**2<=1,inh=(x,y)=>(x-11)**2+(y-4)**2<=11.6,
 tailF=(x,y)=>x<=3&&Math.abs(y-(6+(3-x)*.35))<=1.3,beakF=(x,y)=>(x===14&&(y===3||y===4))||(x===15&&y===4),
 wingF=(x,y)=>((x-6)/3.9)**2+((y-6.2)/2.3)**2<=1,legF=(x,y)=>(x===6||x===9)&&y>=11,
 shp=(x,y)=>x>=0&&y>=0&&x<SW&&y<SHT&&(inb(x,y)||inh(x,y)||tailF(x,y)||beakF(x,y)||legF(x,y));
for(const k in SPX){const s=SPX[k],c=document.createElement('canvas');c.width=SW;c.height=SHT;const g=c.getContext('2d');
 for(let y=0;y<SHT;y++)for(let x=0;x<SW;x++){if(!shp(x,y))continue;
  const kind=beakF(x,y)?'beak':legF(x,y)?'leg':inh(x,y)?'head':tailF(x,y)?'tail':(wingF(x,y)&&inb(x,y))?'wing':'body';
  let col=hx(s.col(x,y,kind));
  if(kind!=='beak'&&kind!=='leg'){const l=cl((-(x-8)*.35-(y-6)*.55)/4,-1,1);let m=l>.5?1.14:l>0?1:l>-.5?.86:.74;
   if(!shp(x-1,y)||!shp(x,y-1)||!shp(x+1,y)||!shp(x,y+1))m*=.7;col=col.map(v=>cl(v*m,0,255));}
  g.fillStyle='rgb('+col.map(Math.round)+')';g.fillRect(x,y,1,1);}
 s.cv=c;s.w=SW;s.h=SHT;}
const POOL=[['mejiro','shijukara'],['shijukara'],['mejiro','joubitaki'],['joubitaki','shijukara']];
const PREF={mejiro:{bush:3,flower:3,water:1},shijukara:{feed:3,box:3,bush:1},joubitaki:{post:3,water:2,rock:1}};
const PERCH=[],items=[];
function rebuildPerch(){PERCH.length=0;
 for(const t of TREES)for(const b of t.br)PERCH.push({x:t.p[0]+b[2],y:t.p[1]+b[3],t:'tree',occ:0});
 PERCH.push({x:ROCK[0],y:ROCK[1]-6,t:'rock',occ:0});
 items.forEach((it,i)=>{const x=it.x,y=it.y;
  if(it.t==='feed')PERCH.push({x,y:y-15,t:'feed',occ:0});
  else if(it.t==='water')PERCH.push({x:x-12,y:y+1,t:'water',occ:0},{x:x+12,y:y+2,t:'water',occ:0});
  else if(it.t==='bush')PERCH.push({x:x+(i%3-1)*3,y:y-11,t:'bush',occ:0});
  else if(it.t==='box')PERCH.push({x,y:y-29,t:'box',occ:0});
  else if(it.t==='post')PERCH.push({x:x+1,y:y-16,t:'post',occ:0});
  else if(it.t==='flower')PERCH.push({x:x-6,y:y+1,t:'flower',occ:0},{x:x+6,y:y+2,t:'flower',occ:0});});}
rebuildPerch();
const birds=[];let bt=0,phase='quiet',phT=rr(3,6),goal=0;
const bez=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
function spawnBird(){
 const sp=POOL[cur][Math.floor(R()*POOL[cur].length)],pr=PREF[sp];let tot=0,pk=null,kind='ok';
 for(const p of PERCH)if(!p.occ&&(pr[p.t]||0)>=2)tot+=pr[p.t];
 if(tot>0){let r=R()*tot;for(const p of PERCH){if(p.occ||(pr[p.t]||0)<2)continue;r-=pr[p.t];if(r<=0){pk=p;break;}}}
 else{kind='look';const tr=PERCH.filter(p=>p.t==='tree'&&!p.occ);pk=tr[Math.floor(R()*tr.length)];}
 if(!pk)return;pk.occ=1;
 const side=R()<.5?-12:W+12,p0=[side,rr(8,44)],p2=[pk.x,pk.y];
 birds.push({sp,pk,kind,st:'in',t:0,p0,p1:[(p0[0]+p2[0])/2,Math.min(p0[1],p2[1])-rr(14,30)],p2,d:1.6+Math.hypot(p2[0]-p0[0],p2[1]-p0[1])/90,x:p0[0],y:p0[1],f:side<0?1:-1,yo:0,hop:0,hopT:1});
}
const BIG=new Set();// 大型の鳥を追加したらここに登録すると、巣箱には入らなくなる
function flyTo(b,pk,st){b.pk.occ=0;pk.occ=1;b.pk=pk;b.st=st;b.t=0;b.p0=[b.x,b.y];b.p2=[pk.x,pk.y];
 b.p1=[(b.x+pk.x)/2,Math.min(b.y,pk.y)-rr(8,22)];b.d=.7+Math.hypot(pk.x-b.x,pk.y-b.y)/80;b.dip=0;b.drink=0;b.enterT=0;b.yo=0;}
function land(b){b.st='perch';b.t=0;b.x=b.p2[0];b.y=b.p2[1];b.yo=0;b.hopT=rr(.8,1.6);b.dipT=0;b.logd=0;b.dip=0;b.drink=0;b.enterT=0;
 const k=b.kind,t=b.pk.t;b.stay=k==='look'?rr(1.6,2.6):rr(5,10);
 if(k==='ok'&&b.moves===undefined)b.moves=1+Math.floor(R()*3);
 logEv(b.sp,t,k);
 if(k==='ok'&&t==='water'){b.drink=rr(2.5,4.5);let bd=1e9,cx=b.x;for(const it of items)if(it.t==='water'){const d=Math.abs(it.x-b.x)+Math.abs(it.y-b.y);if(d<bd){bd=d;cx=it.x;}}b.f=cx>b.x?1:-1;}
 if(k==='ok'&&t==='box'&&!BIG.has(b.sp))b.enterT=rr(.8,1.4);}
function pickPerch(b){const pr=PREF[b.sp],c=[];let tot=0;
 for(const p of PERCH){if(p.occ||p===b.pk)continue;const w=(pr[p.t]||0)+(p.t==='tree'?.8:0);if(w<=0)continue;
  const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<18)continue;const v=w/(1+d/120);c.push([p,v]);tot+=v;}
 if(!tot)return null;let r=R()*tot;for(const q of c){r-=q[1];if(r<=0)return q[0];}return c[c.length-1][0];}
function updBird(b,dt){
 b.t+=dt;
 if(b.st==='in'||b.st==='out'||b.st==='move'){
  const u=Math.min(1,b.t/b.d),e=b.st==='out'?u*u:b.st==='in'?1-(1-u)*(1-u):u*u*(3-2*u),q=bez(b.p0,b.p1,b.p2,e);
  if(Math.abs(q[0]-b.x)>.01)b.f=q[0]>b.x?1:-1;b.x=q[0];b.y=q[1];
  if(u>=1){if(b.st==='out')return true;land(b);}
 }else if(b.st==='inside'){b.inT-=dt;if(b.inT<=0){b.st='perch';b.t=0;b.stay=rr(1.5,3);b.hopT=99;}}
 else{
  b.stay-=dt;
  if(b.enterT>0){b.enterT-=dt;if(b.enterT<=0){b.st='inside';b.inT=rr(4,8);logEv(b.sp,'box','enter');}return false;}
  if(b.drink>0){b.drink-=dt;b.dipT+=dt;const c=b.dipT%.7,a=c<.3?Math.sin(c/.3*Math.PI):0;b.dip=a;if(a>.9&&!b.logd){b.logd=1;logEv(b.sp,'water','drink');}}
  else{b.dip=0;b.hopT-=dt;
   if(b.hopT<=0){b.hopT=rr(.8,2);const t=b.pk.t;
    if((t==='feed'||t==='rock'||t==='water'||t==='flower')&&R()<.7){b.hop=.28;b.h0=b.x;b.h1=cl(b.x+(R()<.5?-1:1)*rr(3,6),b.pk.x-8,b.pk.x+8);b.f=b.h1>b.h0?1:-1;}
    else if(R()<.5)b.f*=-1;}
   if(b.hop>0){b.hop-=dt;const u=1-Math.max(0,b.hop)/.28;b.x=lerp(b.h0,b.h1,u);b.yo=-Math.sin(Math.PI*u)*3;if(b.hop<=0)b.yo=0;}}
  if(b.stay<=0){
   if(b.kind==='ok'&&b.moves>0){b.moves--;const pk=pickPerch(b);if(pk){flyTo(b,pk,'move');return false;}}
   b.pk.occ=0;b.st='out';b.t=0;b.p0=[b.x,b.y];b.yo=0;b.dip=0;const side=R()<.5?-14:W+14;b.p2=[side,rr(4,30)];
   b.p1=[(b.x+side)/2,Math.min(b.y,b.p2[1])-rr(14,28)];b.d=1.6+Math.hypot(side-b.x,b.p2[1]-b.y)/90;}
 }
 return false;
}
const FACE={
 mejiro:{r:['.ggg.','gwgwg','wkbkw','.gyg.','..y..'],p:{g:'#8fa53c',w:'#f6f4ea',k:'#141414',b:'#3f342c',y:'#e6d548'}},
 shijukara:{r:['.kkk.','kkkkk','kkbkk','wwkww','.wkw.'],p:{k:'#1b1b23',w:'#f7f7f2',b:'#2e2e2e'}},
 joubitaki:{r:['.ggg.','ggggg','kkbkk','kkkkk','.ooo.'],p:{g:'#8b9098',k:'#1c1c20',b:'#2b2b2b',o:'#e2712c'}}
};
function drawFace(b){const f=FACE[b.sp],cx=Math.round(b.pk.x),cy=Math.round(b.pk.y+11)+(Math.sin(b.t*2.5)>.85?1:0);
 for(let j=0;j<5;j++)for(let i=0;i<5;i++){const ch=f.r[j][i];if(ch==='.')continue;ctx.fillStyle=f.p[ch];ctx.fillRect(cx-2+i,cy-2+j,1,1);}}
function drawBird(b){
 if(b.st==='inside'){drawFace(b);return;}
 const s=SPX[b.sp],fl=b.f<0,fly=b.st!=='perch',x0=Math.round(b.x-s.w/2),y0=Math.round(b.y-s.h+1+b.yo);
 if(!fly&&!['tree','bush','box','post'].includes(b.pk.t)){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x0+2,Math.round(b.y)+1,s.w-4,1);}
 ctx.save();ctx.translate(fl?x0+s.w:x0,y0);ctx.scale(fl?-1:1,1);
 if(fly)ctx.drawImage(s.cv,0,0,s.w,11,0,0,s.w,11);
 else if(b.dip>0){const dx=Math.round(2*b.dip),dy=Math.round(3*b.dip);ctx.drawImage(s.cv,0,0,9,13,0,0,9,13);ctx.drawImage(s.cv,9,8,7,5,9,8,7,5);ctx.drawImage(s.cv,9,0,7,8,9+dx,dy,7,8);}
 else ctx.drawImage(s.cv,0,0);
 if(fly){const up=((b.t*16)|0)&1;ctx.fillStyle=s.wing;
  const w=up?[[6,2],[7,2],[5,1],[6,1],[7,1],[4,0],[5,0],[6,0],[5,-1],[6,-1],[6,-2]]:[[5,10],[6,10],[7,10],[4,11],[5,11],[6,11],[7,11],[5,12],[6,12],[6,13]];
  for(const p of w)ctx.fillRect(p[0],p[1],1,1);}
 ctx.restore();
}

// ---------- 粒子・水 ----------
const parts=[];let pa=0;
const RATE=[5,0,4,9],PC=[['#f8c6d8','#fbdce6'],[],['#e9862c','#c9532b','#f2b134'],['#ffffff']];
function updParts(dt){
 pa+=dt*RATE[cur];
 while(pa>=1&&parts.length<160){pa--;
  const tr=TREES[Math.floor(R()*TREES.length)];const sx=cur===3?rr(0,W):tr.p[0]+rr(-14,14),sy=cur===3?-3:tr.p[1]-tr.h+rr(-6,8);
  parts.push({x:sx,y:sy,vx:rr(-4,4),vy:cur===3?rr(7,13):rr(9,15),ph:R()*6,t:0,ym:rr(84,152),c:PC[cur][Math.floor(R()*PC[cur].length)],l:0});}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
  if(p.y<p.ym){p.x+=p.vx*dt+Math.sin(p.t*2+p.ph)*7*dt;p.y+=p.vy*dt;}else{p.l+=dt;if(p.l>.8)parts.splice(i,1);}}
}
function drawParts(){for(const p of parts){ctx.globalAlpha=cl(1-p.l/.8,0,1);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),cur===3?1:2,1);}ctx.globalAlpha=1;}
function drawWater(cx,cy,T){
 const w=P.sn,c1=hx('#5f9fc0'),c2=hx('#dbe8f2'),c=[0,1,2].map(i=>Math.round(lerp(c1[i],c2[i],w)));
 for(let dy=-5;dy<=5;dy++){const hw=Math.round(11*Math.sqrt(1-(dy/5.6)*(dy/5.6)));
  ctx.fillStyle='rgb('+(c[0]-(dy>2?18:0))+','+(c[1]-(dy>2?14:0))+','+(c[2]-(dy>2?10:0))+')';ctx.fillRect(cx-hw,cy+dy,hw*2+1,1);}
 ctx.fillStyle='rgba(255,255,255,.75)';
 for(let i=0;i<3;i++){const k=Math.floor(T*2+i*3),x=cx-8+Math.floor(hs(k,i+cx)*16),y=cy-3+Math.floor(hs(i,k+cy)*6);
  if(((x-cx)/10)**2+((y-cy)/5)**2<1)ctx.fillRect(x,y,2,1);}
}

// ---------- 入力・ループ ----------
function setSeason(i){from=P;cur=i;tt=0;autoT=0;
 document.querySelectorAll('#bar button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===i?'true':'false'));}
document.getElementById('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;auto=false;setSeason(+b.dataset.s);});
let tipT=0,tool=null;
function say(m){tip.textContent=m;tip.classList.add('show');tipT=2.8;}
const TG=[[3.6,3.8],[9.8,3.4],[11.4,10.4],[2.4,9.8],[2.8,7.0]];
function tileAt(x,y){const a=(x-OX)/8,b=(y-OY)/4,gx=(a+b)/2,gy=(b-a)/2;return gx>=0&&gy>=0&&gx<N&&gy<N?[Math.floor(gx),Math.floor(gy)]:null;}
function place(x,y){const t=tileAt(x,y);if(!t)return;
 const at=items.findIndex(it=>it.gx===t[0]&&it.gy===t[1]);
 if(tool==='del'){if(at<0)return say('そこには何もない');items.splice(at,1);}
 else{if(at>=0)return say('そこにはもう置いてある');
  if(TG.some(g=>Math.hypot(t[0]+.5-g[0],t[1]+.5-g[1])<1.3))return say('木や岩のそばには置けない');
  if(items.length>=14)return say('これ以上は置けない');
  const p=proj(t[0]+.5,t[1]+.5);items.push({t:tool,gx:t[0],gy:t[1],x:p[0],y:p[1]});}
 rebuildPerch();build();}
document.getElementById('tools').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;
 tool=tool===b.dataset.t?null:b.dataset.t;
 document.querySelectorAll('#tools button[data-t]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===tool?'true':'false'));
 if(tool&&tool!=='del')say('庭のマスをタップして置く');});
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(tool){place(x,y);return;}
 let best=null,bd=14;for(const b of birds){const d=Math.hypot(b.x-x,b.y-5-y);if(d<bd){bd=d;best=b;}}
 if(best){const s=SPX[best.sp];say(s.n+'　'+s.d);}},{passive:false});
// ---- 観察ノート ----
const PN={bush:'低木',feed:'餌台',water:'水場',box:'巣箱',post:'止まり木',flower:'花壇',rock:'岩',tree:'木'};
const seen={},spSeen={},notes=[];let writing=false;
const bookBtn=document.getElementById('bookBtn'),book=document.getElementById('book'),bList=document.getElementById('bookList'),pen=document.getElementById('pen'),paper=document.getElementById('bookPaper');
function logEv(sp,pt,kind){const key=sp+pt+kind;if(seen[key])return;seen[key]=1;const n=SPX[sp].n,lines=[];
 if(!spSeen[sp]){spSeen[sp]=1;lines.push(n+'：'+SPX[sp].d);}
 lines.push(NAME[cur]+'　'+n+({ok:'が'+PN[pt]+'にとまった。',look:'が遠くの枝から庭を見て、そのまま飛んでいった。',drink:'が水場で水を飲んだ。',enter:'が巣箱の中に入っていった。'}[kind]));
 notes.push({sp,lines,done:false});bookBtn.classList.add('new');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function entryEl(n){const d=mk('div','entry'),c=mk('canvas','thumb');c.width=16;c.height=13;c.getContext('2d').drawImage(SPX[n.sp].cv,0,0);
 const t=mk('div','txt');d.append(c,t);return[d,t];}
async function openBook(){book.hidden=false;bList.textContent='';pen.style.display='none';
 if(!notes.length){bList.append(mk('div','empty','まだ何も書かれていない。庭に何かを置いて、鳥を待ってみよう。'));return;}
 for(const n of notes)if(n.done){const[d,t]=entryEl(n);for(const l of n.lines)t.append(mk('p',null,l));bList.append(d);}
 if(writing)return;writing=true;
 for(const n of notes){if(n.done)continue;const[d,t]=entryEl(n);bList.append(d);pen.style.display='';
  for(const l of n.lines){const p=mk('p');t.append(p);
   for(const ch of l){if(book.hidden){writing=false;return;}
    const s=mk('span','ch',ch);s.style.transform='rotate('+rr(-2.5,2.5).toFixed(1)+'deg)';p.append(s);
    const r=s.getBoundingClientRect(),lr=document.getElementById('bookIn').getBoundingClientRect();
    pen.style.left=(r.right-lr.left)+'px';pen.style.top=(r.bottom-lr.top-18)+'px';paper.scrollTop=paper.scrollHeight;
    await sleep(22);s.classList.add('on');await sleep(38);}}
  n.done=true;await sleep(200);}
 pen.style.display='none';writing=false;bookBtn.classList.remove('new');}
bookBtn.addEventListener('click',openBook);
document.getElementById('bookClose').addEventListener('click',()=>{book.hidden=true;});
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),raw=Math.min(innerWidth/W,(innerHeight-112)/H),s=raw>=2?Math.floor(raw):Math.max(.5,raw);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=Math.max(0,(innerHeight-112-H*s)/2)+'px';
 cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);
let T=0,last=performance.now();
function frame(now){
 const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;T+=dt;
 if(tt<1){tt=Math.min(1,tt+dt/1.8);const e=tt*tt*(3-2*tt);P=mix(from,S[cur],e);build();}
 if(auto){autoT+=dt;if(autoT>40)setSeason((cur+1)%4);}
 phT-=dt;
 if(phT<=0){if(phase==='quiet'){phase='active';phT=rr(35,60);goal=1+Math.floor(R()*3);bt=0;}
  else{phase='quiet';phT=rr(12,24);goal=0;for(const b of birds){b.moves=0;if(b.st==='perch')b.stay=Math.min(b.stay,rr(1,5));}}}
 if(phase==='active'){bt-=dt;if(bt<=0){bt=rr(3,8);if(R()<.3)goal=1+Math.floor(R()*3);if(birds.length<goal)spawnBird();}}
 for(let i=birds.length-1;i>=0;i--)if(updBird(birds[i],dt))birds.splice(i,1);
 updParts(dt);
 if(tipT>0){tipT-=dt;if(tipT<=0)tip.classList.remove('show');}
 ctx.drawImage(stC,0,0);for(const it of items)if(it.t==='water')drawWater(it.x,it.y,T);drawParts();
 birds.sort((a,b)=>a.y-b.y);for(const b of birds)drawBird(b);
 requestAnimationFrame(frame);
}
say('下のボタンで庭に物を置いて、鳥を待ってみよう');resize();build();requestAnimationFrame(frame);
})();
