<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>庭に鳥を呼ぶ</title>
<style>
:root{--fg:#2b3a33;--chip:rgba(255,255,255,.55);--chipon:rgba(255,255,255,.95);
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#2b3a33}}
:root[data-theme="dark"]{--fg:#2b3a33}
html,body{margin:0;height:100%;background:#d3e9df;overflow:hidden;color:var(--fg);
 font:13px/1.5 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
#c{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:2}
#bar button{font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:16px;padding:6px 16px;cursor:pointer}
#bar button[aria-pressed="true"]{background:var(--chipon);font-weight:700}
#tip{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2;
 background:var(--chip);padding:6px 14px;border-radius:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#tip.show{opacity:1}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip"></div>
<div id="bar">
 <button data-s="0" aria-pressed="true">春</button><button data-s="1" aria-pressed="false">夏</button>
 <button data-s="2" aria-pressed="false">秋</button><button data-s="3" aria-pressed="false">冬</button>
</div>
<script>
(()=>{
'use strict';
const W=256,H=168,N=13,OX=128,OY=40,TH=8;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
const R=Math.random,rr=(a,b)=>a+R()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const hs=(x,y)=>{x|=0;y|=0;let h=(x*374761393+y*668265263)^(x*y*97);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295;};
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const proj=(gx,gy)=>[Math.round(OX+(gx-gy)*8),Math.round(OY+(gx+gy)*4)];

// ---------- 季節 ----------
const seas=o=>({bg:hx(o.bg),g:o.g.map(hx),ga:hx(o.ga),gap:o.gap,A:o.A.map(hx),al:o.al,aa:hx(o.aa),aap:o.aap,B:o.B.map(hx),bl:o.bl,ba:hx(o.ba),bap:o.bap,sn:o.sn});
const S=[
 seas({bg:'#d3e9df',g:['#8cc56e','#7bb662','#6ba656'],ga:'#fdf7d0',gap:.035,A:['#fbdce6','#f4aec7','#df82a8','#b9587f'],al:.85,aa:'#ffffff',aap:.07,B:['#ffffff','#f6e9ef','#e4c6d4','#bb9aac'],bl:.75,ba:'#f9c4d6',bap:.05,sn:0}),
 seas({bg:'#bfe3ea',g:['#63a94d','#56964a','#4a8541'],ga:'#f4ee7a',gap:.012,A:['#86d16a','#5cae50','#3f8845','#2b6533'],al:1,aa:'#d2f58f',aap:.05,B:['#7cc767','#54a24e','#3c7f41','#2a5c30'],bl:1,ba:'#c8f08a',bap:.04,sn:0}),
 seas({bg:'#efdcb8',g:['#bfa752','#ac9247','#997d3d'],ga:'#d8632a',gap:.09,A:['#f8c245','#ea8f2f','#cc5d27','#96391f'],al:.88,aa:'#ff7d1e',aap:.07,B:['#f07349','#d64a33','#ab2f29','#7a2120'],bl:.88,ba:'#ffb040',bap:.03,sn:0}),
 seas({bg:'#cfdae6',g:['#f4f8fb','#e5edf4','#d5e0ea'],ga:'#8ea36f',gap:.025,A:['#c7b9a8','#a99a88','#8a7b6a','#6a5c4e'],al:.04,aa:'#ffffff',aap:0,B:['#c7b9a8','#a99a88','#8a7b6a','#6a5c4e'],bl:.04,ba:'#ffffff',bap:0,sn:1})
];
const NAME=['春','夏','秋','冬'];
const mix=(a,b,t)=>typeof a==='number'?lerp(a,b,t):Array.isArray(a)?a.map((v,i)=>mix(v,b[i],t)):Object.fromEntries(Object.keys(a).map(k=>[k,mix(a[k],b[k],t)]));
let P=S[0],from=S[0],cur=0,tt=1,auto=true,autoT=0;

// ---------- 静的レイヤー ----------
const D=new Uint8ClampedArray(W*H*4),img=new ImageData(D,W,H);
const stC=document.createElement('canvas');stC.width=W;stC.height=H;const stX=stC.getContext('2d');
function px(x,y,c){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255;}
const rc=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c);};
function line(x1,y1,x2,y2,c,snow){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;
 for(let i=0;i<=n;i++){const x=Math.round(lerp(x1,x2,i/n)),y=Math.round(lerp(y1,y2,i/n));px(x,y,c);if(snow)px(x,y-1,[250,252,255]);}}
const EL=['#6b4f37','#5d432f'].map(hx),ER=['#83613f','#755636'].map(hx);
const CB=[hx('#6a4f39'),hx('#7d5c40'),hx('#8f6b46')];
const SH=[[4.6,4.4,3.8,2.6],[10.6,3.9,2.8,2],[8.0,8.4,3.6,2.2],[5.6,5.9,1.2,.9],[3.2,7.2,1.4,1],[11.4,10.6,2.4,1.6],[3.0,10.4,2.6,1.6]];
const shade=(gx,gy)=>{let f=1;for(const s of SH){const dx=(gx-s[0])/s[2],dy=(gy-s[1])/s[3];if(dx*dx+dy*dy<1)f*=.84;}return f;};
const TREES=[
 {k:'B',p:proj(9.8,3.4),h:26,seed:11,cl:[[0,0,12],[-10,5,9],[10,4,9],[0,-8,8]],br:[[0,-14,-13,-23],[0,-17,12,-24],[0,-22,3,-33]]},
 {k:'A',p:proj(3.6,3.8),h:34,seed:3,cl:[[0,0,16],[-14,6,11],[13,5,12],[-5,-10,10],[8,-9,10]],br:[[0,-17,-20,-30],[0,-22,19,-32],[0,-30,-8,-42],[1,-26,11,-38]]},
 {k:'B',p:proj(11.4,10.4),h:22,seed:23,cl:[[0,0,10],[-8,4,7],[8,3,7],[0,-6,6]],br:[[0,-12,-11,-19],[0,-14,10,-20],[0,-18,2,-27]]},
 {k:'A',p:proj(2.4,9.8),h:24,seed:31,cl:[[0,0,10],[-8,4,7],[8,3,7],[0,-7,6]],br:[[0,-12,-11,-19],[0,-14,10,-20],[0,-18,2,-27]]}
];
const ROCK=proj(2.8,7.0),BAS=proj(7.6,8.2),FEED=proj(5.0,5.6);
const BUSH=[proj(6.6,2.8),proj(12,6.4),proj(1.8,4.8),proj(5.4,11.4)];
const STONES=[proj(6.0,11.0),proj(6.9,10.3),proj(7.6,11.0),proj(8.6,10.6)];

function ground(){
 const g=P.g,bg=P.bg,gg=g[2].map(v=>v*.8);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const a=(x-OX)/8;let b=(y-OY)/4,gx=(a+b)/2,gy=(b-a)/2;
  if(gx>=0&&gy>=0&&gx<N&&gy<N){
   const n=hs(Math.floor(gx*3),Math.floor(gy*3))*.6+hs(x,y)*.4;
   let c=g[n<.35?2:n<.65?1:0];
   if(hs(x*7+3,y*13)<P.gap)c=P.ga;
   const f=shade(gx,gy);px(x,y,[c[0]*f,c[1]*f,c[2]*f]);
  }else{
   let done=false;
   for(let t=1;t<=TH;t++){const b2=(y-t-OY)/4,gx2=(a+b2)/2,gy2=(b2-a)/2;
    if(gx2>=0&&gy2>=0&&gx2<N&&gy2<N){const k=hs(x>>1,y>>1)<.5?0:1;px(x,y,t<=1?gg:(x<OX?EL[k]:ER[k]));done=true;break;}}
   if(!done)px(x,y,bg);
  }
 }
}
function ell(cx,cy,rx,ry,fn){for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)fn(x,y,dx,dy);}}
function tree(t){
 const[bx,by]=t.p,h=t.h,pal=P[t.k],leaf=P[t.k==='A'?'al':'bl'],acc=P[t.k==='A'?'aa':'ba'],accp=P[t.k==='A'?'aap':'bap'],snow=P.sn>.5;
 for(let i=0;i<h;i++){const y=by-i,xo=Math.round(Math.sin(i*.15+t.seed)*1.2),w=i<h*.5?4:3;
  for(let j=0;j<w;j++)px(bx-Math.floor(w/2)+xo+j,y,CB[j===0?0:j===w-1?2:1]);}
 for(const b of t.br)line(bx+b[0],by+b[1],bx+b[2],by+b[3],CB[0],snow);
 for(const c of t.cl){const cx=bx+c[0],cy=by-h+c[1],r=c[2];
  ell(cx,cy,r,r*.82,(x,y,dx,dy)=>{
   const l=cl((-(x-cx)*.55-(y-cy)*.85)/r,-1,1)+(hs(x,y)-.5)*.35,e=Math.sqrt(dx*dx+dy*dy);
   if(hs(x+t.seed,y*3)>=leaf*(e>.85?.75:1))return;
   px(x,y,hs(x*5+t.seed,y*3)<accp?acc:pal[l>.5?0:l>0?1:l>-.5?2:3]);});}
}
const BP=['#5fa050','#468a45','#337038','#245628'].map(hx);
function bush(b){const[bx,by]=b,acc=[0,1,2].map(i=>lerp(hx('#f5f0a0')[i],hx('#c8382e')[i],P.sn));
 for(const c of[[0,0,9],[-7,3,6],[7,3,6]])ell(bx+c[0],by-5+c[1],c[2],c[2]*.75,(x,y,dx,dy)=>{const l=-dx*.5-dy*.8+(hs(x,y)-.5)*.35;
  px(x,y,P.sn>.5&&dy<-.3&&hs(x,y*3)<.7?[246,250,255]:hs(x*5,y*3)<.05+.05*P.sn?acc:BP[l>.4?0:l>0?1:l>-.5?2:3]);});}
function objects(){
 for(const s of STONES)ell(s[0],s[1],5,2.5,(x,y,dx,dy)=>px(x,y,hx((dy<-.2?'#c9ccd0':dy<.4?'#aab0b6':'#8b9198'))));
 for(const b of BUSH)if(b[1]<=BAS[1])bush(b);
 for(const t of TREES)if(t.p[1]<=BAS[1])tree(t);
 ell(ROCK[0],ROCK[1],9,7,(x,y,dx,dy)=>{const l=-dx*.5-dy*.8+(hs(x,y)-.5)*.3;
  px(x,y,P.sn>.5&&dy<-.15?[248,251,255]:hx(l>.35?'#b3b8bd':l>-.1?'#959ba2':'#767c84'));});
 const[fx,fy]=FEED,wd=hx('#a9793f'),rd=hx('#c0503a');
 rc(fx-1,fy-14,3,14,hx('#7a5630'));rc(fx-6,fy-15,13,3,wd);
 rc(fx-4,fy-18,1,3,hx('#7a5630'));rc(fx+4,fy-18,1,3,hx('#7a5630'));
 rc(fx-4,fy-19,9,1,rd);rc(fx-3,fy-20,7,1,rd);rc(fx-2,fy-21,5,1,rd);rc(fx-1,fy-22,3,1,P.sn>.5?[248,251,255]:rd);
 for(let i=0;i<4;i++)px(fx-3+i*2,fy-16,hx('#e9c46a'));
 const[bx,by]=BAS;
 ell(bx,by+3,28,14.5,(x,y)=>px(x,y,hx('#6f757b')));
 ell(bx,by,28,14.5,(x,y,dx,dy)=>px(x,y,hx(hs(x,y)<.1?'#8b9197':-dx*.4-dy*.6>.2?'#c2c7cb':'#a4aab0')));
 for(const b of BUSH)if(b[1]>BAS[1])bush(b);
 for(const t of TREES)if(t.p[1]>BAS[1])tree(t);
}
function build(){ground();objects();stX.putImageData(img,0,0);
 document.body.style.background='rgb('+P.bg.map(Math.round)+')';}

// ---------- 鳥 ----------
const SW=16,SHT=13;
const SPX={
 mejiro:{n:'メジロ',d:'目のまわりの白い輪。花の蜜を吸いにくる',wing:'#6d8230',
  col(x,y,k){const d=Math.hypot(x-12,y-3);
   if(k==='beak')return'#3f342c';if(k==='leg')return'#77685a';
   if(x===12&&y===3)return'#141414';
   if(k==='head'){if(d>1&&d<=2.1)return'#f6f4ea';return y>=5&&x>=10?'#e6d548':'#8fa53c';}
   if(k==='wing')return(x+y)%3?'#6d8230':'#7f9639';
   if(k==='tail')return'#647a2c';
   return y<6.2?'#8fa53c':(y<7.6&&x<8?'#d9a68c':'#eeebd9');}},
 shijukara:{n:'シジュウカラ',d:'白いほおと、おなかの黒いネクタイ',wing:'#6c8196',
  col(x,y,k){if(k==='beak')return'#2e2e2e';if(k==='leg')return'#55504a';
   if(k==='head')return((x-11.5)/2.6)**2+((y-5)/1.5)**2<=1?'#f7f7f2':'#1b1b23';
   if(k==='wing')return y===5&&x>=4&&x<=8?'#f2f2ee':'#6c8196';
   if(k==='tail')return'#6c8196';
   if(y<6.2)return'#8f9f7a';
   return Math.abs(y-(6.2+(11-x)*.45))<=.7&&x>=5&&x<=11?'#23232b':'#efe8b6';}},
 joubitaki:{n:'ジョウビタキ',d:'翼の白い斑点。冬にやってくる渡り鳥',wing:'#584844',
  col(x,y,k){if(k==='beak')return'#2b2b2b';if(k==='leg')return'#3d3733';
   if(k==='head')return x>=10&&y>=3&&y<=5?'#1c1c20':(y<=3?'#a8aeb6':'#8b9098');
   if(k==='wing')return x>=7&&x<=8&&y>=5&&y<=6?'#f6f6f0':'#584844';
   if(k==='tail')return'#d55a20';
   if(y<6.4)return'#7c8088';return y>=8.6?'#f0d0ac':'#e2712c';}}
};
const inb=(x,y)=>((x-7)/6.6)**2+((y-6.6)/4.2)**2<=1,inh=(x,y)=>(x-11)**2+(y-4)**2<=11.6,
 tailF=(x,y)=>x<=3&&Math.abs(y-(6+(3-x)*.35))<=1.3,beakF=(x,y)=>(x===14&&(y===3||y===4))||(x===15&&y===4),
 wingF=(x,y)=>((x-6)/3.9)**2+((y-6.2)/2.3)**2<=1,legF=(x,y)=>(x===6||x===9)&&y>=11,
 shp=(x,y)=>x>=0&&y>=0&&x<SW&&y<SHT&&(inb(x,y)||inh(x,y)||tailF(x,y)||beakF(x,y)||legF(x,y));
for(const k in SPX){const s=SPX[k],c=document.createElement('canvas');c.width=SW;c.height=SHT;const g=c.getContext('2d');
 for(let y=0;y<SHT;y++)for(let x=0;x<SW;x++){if(!shp(x,y))continue;
  const kind=beakF(x,y)?'beak':legF(x,y)?'leg':inh(x,y)?'head':tailF(x,y)?'tail':(wingF(x,y)&&inb(x,y))?'wing':'body';
  let col=hx(s.col(x,y,kind));
  if(kind!=='beak'&&kind!=='leg'){const l=cl((-(x-8)*.35-(y-6)*.55)/4,-1,1);let m=l>.5?1.14:l>0?1:l>-.5?.86:.74;
   if(!shp(x-1,y)||!shp(x,y-1)||!shp(x+1,y)||!shp(x,y+1))m*=.7;col=col.map(v=>cl(v*m,0,255));}
  g.fillStyle='rgb('+col.map(Math.round)+')';g.fillRect(x,y,1,1);}
 s.cv=c;s.w=SW;s.h=SHT;}
const POOL=[['mejiro','shijukara'],['shijukara'],['mejiro','joubitaki'],['joubitaki','shijukara']];
const PREF={mejiro:{brA:3,brB:3,feed:1,water:1},shijukara:{brA:2,brB:1,feed:3,water:1,ground:1},joubitaki:{rock:3,ground:2,water:1,feed:1,brB:1}};
const PERCH=[];
for(const t of TREES)for(const b of t.br)PERCH.push({x:t.p[0]+b[2],y:t.p[1]+b[3],t:'br'+t.k,occ:0});
PERCH.push({x:FEED[0],y:FEED[1]-15,t:'feed',occ:0},{x:BAS[0]-26,y:BAS[1]+1,t:'water',occ:0},{x:BAS[0]+26,y:BAS[1]+2,t:'water',occ:0},{x:ROCK[0],y:ROCK[1]-6,t:'rock',occ:0});
for(const b of BUSH)PERCH.push({x:b[0]+Math.round(rr(-4,4)),y:b[1]-11,t:'brB',occ:0});
for(const g of[proj(7.2,4.6),proj(4.2,7.4),proj(10.4,7.6),proj(6.4,9.6),proj(11.6,5.0),proj(3.8,5.6)])PERCH.push({x:g[0],y:g[1],t:'ground',occ:0});
const birds=[];let bt=1.2;
const bez=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
function spawnBird(){
 const sp=POOL[cur][Math.floor(R()*POOL[cur].length)],pr=PREF[sp];let tot=0;
 for(const p of PERCH)if(!p.occ)tot+=pr[p.t]||0;if(!tot)return;
 let r=R()*tot,pk=null;for(const p of PERCH){if(p.occ)continue;r-=pr[p.t]||0;if(r<=0){pk=p;break;}}
 if(!pk)return;pk.occ=1;
 const side=R()<.5?-12:W+12,p0=[side,rr(8,44)],p2=[pk.x,pk.y];
 birds.push({sp,pk,st:'in',t:0,p0,p1:[(p0[0]+p2[0])/2,Math.min(p0[1],p2[1])-rr(14,30)],p2,d:1.6+Math.hypot(p2[0]-p0[0],p2[1]-p0[1])/90,x:p0[0],y:p0[1],f:side<0?1:-1,yo:0,hop:0,hopT:1});
}
function updBird(b,dt){
 b.t+=dt;
 if(b.st==='in'||b.st==='out'){
  const u=Math.min(1,b.t/b.d),e=b.st==='in'?1-(1-u)*(1-u):u*u,q=bez(b.p0,b.p1,b.p2,e);
  if(Math.abs(q[0]-b.x)>.01)b.f=q[0]>b.x?1:-1;b.x=q[0];b.y=q[1];
  if(u>=1){if(b.st==='in'){b.st='perch';b.t=0;b.stay=rr(3,7);b.x=b.p2[0];b.y=b.p2[1];b.hopT=rr(.6,1.4);b.yo=0;}else return true;}
 }else{
  b.stay-=dt;b.hopT-=dt;
  if(b.hopT<=0){b.hopT=rr(.8,2);
   if((b.pk.t==='ground'||b.pk.t==='feed'||b.pk.t==='rock'||b.pk.t==='water')&&R()<.7){b.hop=.28;b.h0=b.x;b.h1=cl(b.x+(R()<.5?-1:1)*rr(3,6),b.pk.x-8,b.pk.x+8);b.f=b.h1>b.h0?1:-1;}
   else if(R()<.5)b.f*=-1;}
  if(b.hop>0){b.hop-=dt;const u=1-Math.max(0,b.hop)/.28;b.x=lerp(b.h0,b.h1,u);b.yo=-Math.sin(Math.PI*u)*3;if(b.hop<=0)b.yo=0;}
  if(b.stay<=0){b.pk.occ=0;b.st='out';b.t=0;b.p0=[b.x,b.y];const side=R()<.5?-14:W+14;b.p2=[side,rr(4,30)];b.p1=[(b.x+side)/2,Math.min(b.y,b.p2[1])-rr(14,28)];b.d=1.6+Math.hypot(side-b.x,b.p2[1]-b.y)/90;}
 }
 return false;
}
function drawBird(b){
 const s=SPX[b.sp],fl=b.f<0,fly=b.st!=='perch',x0=Math.round(b.x-s.w/2),y0=Math.round(b.y-s.h+1+b.yo);
 if(!fly&&b.pk.t!=='brA'&&b.pk.t!=='brB'){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x0+2,Math.round(b.y)+1,s.w-4,1);}
 ctx.save();ctx.translate(fl?x0+s.w:x0,y0);ctx.scale(fl?-1:1,1);
 if(fly)ctx.drawImage(s.cv,0,0,s.w,11,0,0,s.w,11);else ctx.drawImage(s.cv,0,0);
 if(fly){const up=((b.t*16)|0)&1;ctx.fillStyle=s.wing;
  const w=up?[[6,2],[7,2],[5,1],[6,1],[7,1],[4,0],[5,0],[6,0],[5,-1],[6,-1],[6,-2]]:[[5,10],[6,10],[7,10],[4,11],[5,11],[6,11],[7,11],[5,12],[6,12],[6,13]];
  for(const p of w)ctx.fillRect(p[0],p[1],1,1);}
 ctx.restore();
}

// ---------- 粒子・水 ----------
const parts=[];let pa=0;
const RATE=[5,0,4,9],PC=[['#f8c6d8','#fbdce6'],[],['#e9862c','#c9532b','#f2b134'],['#ffffff']];
function updParts(dt){
 pa+=dt*RATE[cur];
 while(pa>=1&&parts.length<160){pa--;
  const tr=TREES[Math.floor(R()*TREES.length)];const sx=cur===3?rr(0,W):tr.p[0]+rr(-14,14),sy=cur===3?-3:tr.p[1]-tr.h+rr(-6,8);
  parts.push({x:sx,y:sy,vx:rr(-4,4),vy:cur===3?rr(7,13):rr(9,15),ph:R()*6,t:0,ym:rr(84,152),c:PC[cur][Math.floor(R()*PC[cur].length)],l:0});}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
  if(p.y<p.ym){p.x+=p.vx*dt+Math.sin(p.t*2+p.ph)*7*dt;p.y+=p.vy*dt;}else{p.l+=dt;if(p.l>.8)parts.splice(i,1);}}
}
function drawParts(){for(const p of parts){ctx.globalAlpha=cl(1-p.l/.8,0,1);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),cur===3?1:2,1);}ctx.globalAlpha=1;}
function drawWater(T){
 const[cx,cy]=BAS,w=P.sn,c1=hx('#5f9fc0'),c2=hx('#dbe8f2'),c=[0,1,2].map(i=>Math.round(lerp(c1[i],c2[i],w)));
 for(let dy=-11;dy<=11;dy++){const hw=Math.round(24*Math.sqrt(1-(dy/11.5)*(dy/11.5)));
  ctx.fillStyle='rgb('+(c[0]-(dy>4?18:0))+','+(c[1]-(dy>4?14:0))+','+(c[2]-(dy>4?10:0))+')';ctx.fillRect(cx-hw,cy+dy,hw*2+1,1);}
 ctx.fillStyle='rgba(255,255,255,.75)';
 for(let i=0;i<6;i++){const k=Math.floor(T*2+i*3),x=cx-18+Math.floor(hs(k,i)*36),y=cy-7+Math.floor(hs(i,k)*14);
  if(((x-cx)/22)**2+((y-cy)/10.5)**2<1)ctx.fillRect(x,y,2,1);}
}

// ---------- 入力・ループ ----------
function setSeason(i){from=P;cur=i;tt=0;autoT=0;
 document.querySelectorAll('#bar button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===i?'true':'false'));}
document.getElementById('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;auto=false;setSeason(+b.dataset.s);});
let tipT=0;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 let best=null,bd=14;for(const b of birds){const d=Math.hypot(b.x-x,b.y-5-y);if(d<bd){bd=d;best=b;}}
 if(best){const s=SPX[best.sp];tip.textContent=s.n+'　'+s.d;tip.classList.add('show');tipT=3;}},{passive:false});
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),raw=Math.min(innerWidth/W,(innerHeight-60)/H),s=raw>=2?Math.floor(raw):Math.max(.5,raw);
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=Math.max(0,(innerHeight-60-H*s)/2)+'px';
 cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);
let T=0,last=performance.now();
function frame(now){
 const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;T+=dt;
 if(tt<1){tt=Math.min(1,tt+dt/1.8);const e=tt*tt*(3-2*tt);P=mix(from,S[cur],e);build();}
 if(auto){autoT+=dt;if(autoT>26)setSeason((cur+1)%4);}
 bt-=dt;if(bt<=0){bt=rr(2.5,6);if(birds.length<3)spawnBird();}
 for(let i=birds.length-1;i>=0;i--)if(updBird(birds[i],dt))birds.splice(i,1);
 updParts(dt);
 if(tipT>0){tipT-=dt;if(tipT<=0)tip.classList.remove('show');}
 ctx.drawImage(stC,0,0);drawWater(T);drawParts();
 birds.sort((a,b)=>a.y-b.y);for(const b of birds)drawBird(b);
 requestAnimationFrame(frame);
}
resize();build();requestAnimationFrame(frame);
})();
</script>
